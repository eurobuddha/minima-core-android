plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.minimarex.minimacore'
    compileSdk 36

    defaultConfig {
        applicationId "org.minimarex.minimacore"
        minSdk 28
        targetSdk 35
        // vc25: unifies the parallel 1.3.2/1.3.3 (vc23/24, Filez session) and 1.4.0/1.4.1
        // (vc23/24, params session) release lines - same code, clashing codes. 1.4.2/vc25
        // supersedes every installed variant so all devices get offered the update.
        // vc34: truthful chain feedback - node errors come from the right key ("message",
        // not just "error"), a posted txn says "mining" rather than "sent", and NEWBALANCE
        // reaches the UI. Bump BEFORE building - a published versionCode is never reused.
        // vc35: SECURITY - the bundled minima.jar carries the Wallet.signData fix. That method
        // was the only unsynchronized mutator on Wallet and its read-modify-write of the key
        // `uses` counter let two concurrent signers spend the SAME Winternitz leaf on different
        // data, which leaks that leaf's private key. Confirmed in the wild (7 of 64 keys).
        // vc36: SECURITY - allowBackup is off. getFilesDir() IS the node's data directory and main_prefs
        // holds the BIP39 seed in cleartext, yet the manifest carried the scaffold default (allowBackup=true
        // with NO rules attributes at all), so Android Auto Backup was uploading a spendable wallet and its
        // private keys to the user's cloud - and a restore could reconstitute a signing node on any phone.
        // Cloud backup and device transfer are both excluded now.
        // vc39: FIX - the bundled minima.jar carries the Wallet.removeScript cache fix. Demoting a
        // shared script with `newscript trackall:false` deleted only the DB row; the in-memory
        // mAllTrackedAddress cache kept the address until restart, so a polluted node kept adopting
        // EVERY stranger's coin at a shared covenant (e.g. the casino) into its relevant set every
        // block. removeScript now clears the caches, so the demote takes effect immediately.
        // vc40: full-precision balance wrapping and retained resync progress/restart feedback.
        // vc41: keyboard-aware screen resizing and an explicit keyboard dismissal action.
        // vc42: let the main overflow menu icon follow the light/dark theme.
        // vc43: six-decimal wallet summaries; exact amounts remain in token/coin details.
        // vc44: safe metadata downloads, lifecycle-safe startup/API, bounded coalesced reads and caching.
        // vc45: PERF - the bundled minima.jar indexes txpow.timemilli and (isrelevant, timemilli),
        // and gives getLatestTxPoW's query a WHERE clause so H2 will actually use that index.
        // Those columns were unindexed while five hot statements sorted or filtered on them, so
        // `SELECT * FROM txpow ORDER BY timemilli DESC` was a full table scan that dragged every
        // row's txpowdata BLOB through the sort. Every TxPoWSqlDB method is synchronized, so one
        // `history` call from any companion stalled all node DB reads - including the SINGLE-
        // threaded IPC command executor. Measured on R58M307HEEN (2026-09-11, 500MB+ txpow store):
        // all 1626 Long-monitor-contention mentions named TxPoWSqlDB, 506 holds by getLatestTxPoW
        // blocking exists (299) and getTxPoW (210), longest hold 47.171s against a 30s
        // NodeApi.READ_TIMEOUT_MS. See diag/README.md.
        // The index alone was NOT enough: H2 refuses to use an index for a bare ORDER BY .. LIMIT
        // with no WHERE, so the query carries a deliberate `timemilli > 0`. Verified on H2 2.1.214
        // with 60k rows - 25,535 page reads as a tableScan vs 3,755 via the index.
        // CREATE INDEX IF NOT EXISTS runs in createSQL(), so existing DBs index on next start -
        // expect one slow first boot while it builds. No migration, no schema version.
        versionCode 45
        versionName "1.6.17-ui-h2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    //H2 database
    implementation 'com.h2database:h2:2.1.214'

    //Bouncy Castle
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'

    //Toolbar
    implementation ("com.google.android.material:material:1.13.0")

    //QR Code
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //SVG token icons (some Minima tokens carry inline/URL SVG art)
    implementation 'com.caverock:androidsvg-aar:1.4'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation files('libs/minima.jar')
    implementation project(':minimaapi')
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
