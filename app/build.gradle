        // 2.2.111: the Zero Edge Casino is removed from the APK pending an audit and rebuild (owner, 23 Nov: its
        // coin-state values reached admin node commands). Source kept, unreferenced, in integrated/casino; its old
        // WorkManager job and notification channels are cleared at every start; its bet secrets are kept.
        // 2.2.112: Dexicon (AtomiX engine): the wallet keeper's split asks for coinage:3 (every real node refuses a send
        // below 3, so the coinage:1 split never ran) and a failed keeper merge/split backs off quietly (logged, retried).
        // 2.2.113: Future Cash: a real node's "coins coinid:" returns no row for a spent coin, so "no row" is unknown,
        // never proof: a posted sweep with no row is swept once its output is at the safe (else unverified after 30
        // blocks, never the theft alarm, never dropped as a reorg); a posted collect with no row is done once its
        // output is at the payout (safe collects stay safe instead of falling back to the sweep).
        // 2.2.114: SECURITY, typed text never reaches a node command with ';' (the node splits there and runs each
        // piece as admin): Future Cash refuses ';' and control characters in every command and resolves only an Mx
        // recipient with checkaddress; Atelier refuses them in every command (typed mint fields); the Salon identity
        // claim refuses ';' in name / bio and needs an http(s) profile URL; Block Explorer searches only a real Mx.
        // 2.2.115: the Minima dollar token is MxUSD in every shipped string (five strings in four languages, the
        // catalog and the message templates still said mxUSDT).
        // 2.2.116: test only - the Keets inbox test drops the ChatDb singleton afterwards (its rows broke ChatBackupTest).
        versionCode 386
        versionName "2.2.116"

        buildConfigField "boolean", "PANDAMONIUM", "false"
        // PANDA_SHELL: Pandamonium-style tabs (Wallet/History/Apps/Chat/Node) + the embedded
        // node-event feed History needs. True for block + pandamonium; false for classic.
        // INVARIANT: any flavor with PANDAMONIUM=true MUST set PANDA_SHELL=true (the superapp
        // host relies on the shell tab positions). A verifyPandaShellInvariant check below
        // fails the build if that is ever violated.
        buildConfigField "boolean", "PANDA_SHELL", "false"
        // Brand line under the Node-screen "Minima Core" title ("" = none).
        buildConfigField "String", "SHELL_BRAND", "\"\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["keymode"]
    productFlavors {
        classic {
            dimension "keymode"
            versionNameSuffix "-PandaBear"
            // Existing app, existing users, legacy 64x3 keys. applicationId stays the
            // defaultConfig com.eurobuddha.minimacore.
            buildConfigField "boolean", "BLOCK_KEYUSES", "false"
            // Node P2P port. Each bear listens on its own port so two bears on one phone (or one
            // Wi-Fi) never collide; keets' loopback API is port+5. Overridable by -port in extra params.
            buildConfigField "int", "NODE_PORT", "13001"
        }
        block {
            dimension "keymode"
            // NEW SKU - fresh installs only. Forces the upstream block-as-keyuses system
            // (128x4 trees, keyuses = chain tip block). A classic seed restored here gets
            // DIFFERENT addresses, so this is never shipped as an update to classic.
            applicationId "com.eurobuddha.minimablock"
            versionNameSuffix "-BlackBear"
            buildConfigField "boolean", "BLOCK_KEYUSES", "true"
            // BlackBear mirrors Pandamonium's tab shell + History, minus the integrated DeFi apps.
            buildConfigField "boolean", "PANDA_SHELL", "true"
            buildConfigField "String", "SHELL_BRAND", "\"BlackBear\""
            buildConfigField "int", "NODE_PORT", "21001"
        }
        pandamonium {
            dimension "keymode"
            applicationId "com.eurobuddha.pandamonium"
            versionNameSuffix "-Pandamonium"
            buildConfigField "boolean", "BLOCK_KEYUSES", "true"
            buildConfigField "boolean", "PANDAMONIUM", "true"
            buildConfigField "boolean", "PANDA_SHELL", "true"
            buildConfigField "int", "NODE_PORT", "25001"
        }
    }

    // BlackBear (block) and Pandamonium share the Pandamonium-style shell code (e.g. the History
    // tab) that classic/PandaBear does not ship. One source set, added to both flavors, avoids
    // duplicating those files per flavor.
    sourceSets {
        block.java.srcDirs += 'src/pandaShell/java'
        pandamonium.java.srcDirs += 'src/pandaShell/java'
    }

    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // keets/bare-kit ships a ~65MB runtime PER ABI. Release carries arm64-v8a only:
            // 32-bit-only devices are overwhelmingly Android 9-, where the worklet is
            // API-gated off anyway — they install and run classic-only (UnsatisfiedLinkError
            // is caught). Debug keeps all ABIs for the emulator.
            ndk { abiFilters 'arm64-v8a' }
        }
    }
    // Reuse Atelier/Salon standalone packaging: JSch and jspecify duplicate
    // these OSGi/dependency metadata entries; Android does not consume them.
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES']
        }
    }

    // Audit the integrated app code under the SDK configuration that actually ships.
    lint { checkDependencies = true }

    testOptions { unitTests.includeAndroidResources = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// INVARIANT: PANDAMONIUM ⇒ PANDA_SHELL. The superapp host's tab positions come from
// PANDA_SHELL; a flavor that turned PANDAMONIUM on without it would silently misposition tabs.
// Fail the build rather than ship that.
android.productFlavors.all { f ->
    def pm = f.buildConfigFields['PANDAMONIUM']?.value
    def ps = f.buildConfigFields['PANDA_SHELL']?.value
    if (pm == 'true' && ps != 'true') {
        throw new GradleException("Flavor '${f.name}': PANDAMONIUM=true requires PANDA_SHELL=true")
    }
}

// Generated Keets inputs are not in Git. Every checkout prepares the pinned inputs
// before assets/JNI merging or AAR transforms; Gradle --offline also governs Keets.
def prepareKeets = tasks.register('prepareKeets', Exec) {
    workingDir rootProject.projectDir
    commandLine(['python3', 'scripts/prepare-keets.py'] +
            (gradle.startParameter.offline ? ['--offline'] : []))
}
def verifyKeetsArtifacts = tasks.register('verifyKeetsArtifacts', Exec) {
    dependsOn prepareKeets
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/verify-keets-artifacts.py'
}
tasks.named('preBuild').configure { dependsOn verifyKeetsArtifacts }
// The miniMall / NFT Wallet sources the import copies must match integrated/ (point release 2026-11-21, item 4).
def verifyPandamoniumSources = tasks.register('verifyPandamoniumSources', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/verify-pandamonium-sources.py'
}
tasks.named('preBuild').configure { dependsOn verifyPandamoniumSources }

// Family rule (CLAUDE.md): apps that vendor the Minima Winternitz signer pin bcprov-jdk15on 1.69 (BC 1.71+ dropped gmss).
// Pandamonium vendors it (Dexicon's account module, the wallet); web3j 4.9.8 asks for 1.70. Standalone Dexicon runs the
// same web3j on a strict 1.69. JVM test classpaths are left alone (Robolectric brings its own BC).
configurations.configureEach {
    if (!name.toLowerCase().contains('test')) resolutionStrategy.force 'org.bouncycastle:bcprov-jdk15on:1.69'
}

dependencies {

    //H2 database
    implementation 'com.h2database:h2:2.1.214'

    //Bouncy Castle
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.69'

    //Toolbar
    implementation ("com.google.android.material:material:1.13.0")

    //QR Code
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //SVG token icons (some Minima tokens carry inline/URL SVG art)
    implementation 'com.caverock:androidsvg-aar:1.4'

    //App-open lock: fingerprint/face unlock (the PIN is always the fallback)
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation files('libs/minima.jar')
    // bare-kit: the mobile JS runtime hosting the keets sidecar worklet.
    // NOT in git (~80MB) — scripts/fetch-bare-kit.sh builds it from the pinned release.
    implementation files('libs/bare-kit.aar').builtBy(verifyKeetsArtifacts)
    implementation project(':minimaapi')
    implementation project(':localization')
    // Parlons/Maxima transport core, vendored under maxima-core/ (MAX# contacts in Chat).
    // The fork's node has NO Maxima - the app carries the clean-room core itself, like mininotes.
    implementation project(':maxima-core')
    testImplementation libs.junit
    // Robolectric + json are shared so the (main-code) ChatFailureDialogTest runs for every
    // flavor's unit tests, not just Pandamonium's. web3j stays Pandamonium-only (its tests need it).
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
    testPandamoniumImplementation 'org.web3j:crypto:4.9.8'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// Feature code is linked only into Pandamonium; classic and block keep their existing contents.
dependencies {
    pandamoniumImplementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    pandamoniumImplementation 'androidx.work:work-runtime:2.9.1'   // already in the APK via the integrated apps; the deep freeze cancels their jobs
    pandamoniumImplementation project(':integrated-ethwallet')
    // 2.2.34: one Dexicon tab on the host node wallet replaces the built-in AtomiX, PandaPools and PandaDEX.
    pandamoniumImplementation project(':integrated-dexicon')
    pandamoniumImplementation project(':integrated-futurecash-next')
    pandamoniumImplementation project(':integrated-blockexplorer')
    pandamoniumImplementation project(':integrated-filez')
    pandamoniumImplementation project(':integrated-history')
    // BlackBear also ships History (its only integrated tab); no other integrated apps.
    blockImplementation project(':integrated-history')
    pandamoniumImplementation project(':integrated-vestr')
    pandamoniumImplementation project(':integrated-entropy')
    pandamoniumImplementation project(':integrated-terminalide')
    pandamoniumImplementation project(':integrated-mail')
    pandamoniumImplementation project(':integrated-utxo')
    pandamoniumImplementation project(':integrated-merchshop')
    pandamoniumImplementation project(':integrated-merchstudio')
    pandamoniumImplementation project(':integrated-merchinbox')
    pandamoniumImplementation project(':integrated-NFTwallet')
    pandamoniumImplementation project(':integrated-wallet')
    pandamoniumImplementation project(':integrated-atelier')
    pandamoniumImplementation project(':integrated-salon')
    pandamoniumImplementation project(':integrated-keyreuses')
    pandamoniumImplementation project(':integrated-faucet')
}

// Verify the packaged bytes, including code/data sections after Android strips symbols.
android.applicationVariants.all { variant ->
    def checkApk = tasks.register("verify${variant.name.capitalize()}KeetsApk", Exec) {
        dependsOn variant.packageApplicationProvider
        workingDir rootProject.projectDir
        commandLine 'python3', 'scripts/verify-keets-artifacts.py', '--remove-invalid-apk', '--apk-dir',
                layout.buildDirectory.dir("outputs/apk/${variant.flavorName}/${variant.buildType.name}").get().asFile.absolutePath
    }
    variant.assembleProvider.configure { dependsOn checkApk }
}
