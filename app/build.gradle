        // 2.2.33: seed entry review fixes - node-context any-phrase may be list words (old first-run wallets were hashed as
        // typed; old Vault took 12-21 words) and then asks "Minima's form or exactly as typed"; near-miss word phrases,
        // a leading "-" and [ ] { } refused; paste never drops words; no spill-over after auto-complete; first-run screens
