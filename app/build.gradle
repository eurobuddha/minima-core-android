        // 2.2.29: built-in AtomiX locks name the receiver's address at port 253 (AtomiX 0.2.32): the receiver's node tracks
        // the lock and sees its claim or refund, so a Trading Account receiver is never left with a phantom balance.
        // 2.2.30: the node's balance command no longer crashes on a coin restored without its token details
