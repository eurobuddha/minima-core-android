// Imported native feature; see ../sources.lock.json and scripts/import-pandamonium.py.
plugins { alias(libs.plugins.android.library) }
android {
    namespace 'com.eurobuddha.pandapools'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'String', 'VERSION_NAME', '"0.9.66"'
        buildConfigField 'int', 'VERSION_CODE', '966'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    implementation project(':minimaapi')
}
