// Imported native feature; see ../sources.lock.json and scripts/import-pandamonium.py.
plugins { alias(libs.plugins.android.library) }
android {
    namespace 'com.eurobuddha.wallet'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'String', 'VERSION_NAME', '"0.2.21"'
        buildConfigField 'int', 'VERSION_CODE', '221'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':localization')
    compileOnly files('../../app/libs/minima.jar')
    testImplementation files('../../app/libs/minima.jar')
    testImplementation 'com.h2database:h2:2.1.214'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    testImplementation libs.junit
    implementation project(':minimaapi')
    testImplementation 'org.json:json:20240303'
}
