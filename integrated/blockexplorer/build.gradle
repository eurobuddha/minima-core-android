// Imported native feature; see ../sources.lock.json and scripts/import-pandamonium.py.
plugins { alias(libs.plugins.android.library) }
android {
    namespace 'com.eurobuddha.blockexplorer'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'String', 'VERSION_NAME', '"0.1.5"'
        buildConfigField 'int', 'VERSION_CODE', '105'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation project(':minimaapi')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
