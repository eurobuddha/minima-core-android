// Imported native feature; see ../sources.lock.json and scripts/import-pandamonium.py.
plugins { alias(libs.plugins.android.library) }
android {
    namespace 'com.eurobuddha.statenft'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'String', 'VERSION_NAME', '"0.7.18"'
        buildConfigField 'int', 'VERSION_CODE', '718'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    testImplementation files('../../app/libs/minima.jar')
    implementation project(':localization')
    testImplementation 'org.mockito:mockito-core:5.12.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'com.github.mwiede:jsch:0.2.21'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation project(':minimaapi')
}
