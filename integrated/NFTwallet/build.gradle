// Imported native feature; see ../sources.lock.json and scripts/import-pandamonium.py.
plugins { alias(libs.plugins.android.library) }
android {
    namespace 'com.eurobuddha.nftwallet'
    compileSdk 36
    defaultConfig {
        minSdk 28
        buildConfigField 'String', 'VERSION_NAME', '"0.1.13"'
        buildConfigField 'int', 'VERSION_CODE', '113'
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':localization')
    testImplementation 'org.mockito:mockito-core:5.12.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
    implementation project(':minimaapi')
}
