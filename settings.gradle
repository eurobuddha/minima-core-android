pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Minima Core"
include ':app'
include ':minimaapi'
include ':localization'
include ':maxima-core'   // the Parlons/Maxima transport core, vendored (MAX# contacts in Chat)

// Reviewed source snapshots of the existing native companion apps.
// 2.2.34: Dexicon (one trading tab on the host node wallet) replaces the built-in AtomiX, PandaPools and PandaDEX.
['ethwallet','dexicon','futurecash-next','casino','blockexplorer','filez','history','vestr','entropy','terminalide','mail','utxo','merchshop','merchstudio','merchinbox','NFTwallet','wallet','atelier','salon','keyreuses','faucet'].each { feature ->
    include ":integrated-${feature}"
    project(":integrated-${feature}").projectDir = file("integrated/${feature}")
}

// Standalone Mail with the updated SDK, only for cross-APK compatibility verification.
if (providers.gradleProperty('companionReview').isPresent()) {
    include ':review-companion-mail'
    project(':review-companion-mail').projectDir = file('review/companion-mail')
    include ':review-companion-pandadex'
    project(':review-companion-pandadex').projectDir = file('review/companion-pandadex')
}
